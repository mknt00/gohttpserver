<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - [[.FileName]]</title>
    <link rel="stylesheet" type="text/css" href="/-/assets/css/style.css">
    <link rel="stylesheet" type="text/css" href="/-/assets/css/themes/ocean.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; }
        .video-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        video { max-width: 100%; max-height: 100%; outline: none; }
        .vp-bar { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; background: rgba(0,0,0,0.6); display: flex; align-items: center; gap: 12px; }
        .vp-bar a { color: #fff; text-decoration: none; font-size: 14px; opacity: 0.85; }
        .vp-bar a:hover { opacity: 1; }
        .vp-title { color: #fff; font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="vp-bar">
        <a href="javascript:history.back()">← Back</a>
        <span class="vp-title">[[.FileName]]</span>
    </div>
    <div class="video-container">
        <video id="videoPlayer" controls autoplay>
            <source src="[[.VideoURL]]" type="video/[[.Extension]]">
            Your browser does not support the video tag.
        </video>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var video = document.getElementById('videoPlayer');
            video.focus();
        });
    </script>
</body>
</html>
